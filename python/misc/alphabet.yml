# ANS Tables
#
# The values of frequencies are extracted from StaticBAC (https://github.com/Jiovana/StaticBAC/blob/main/source/Lib/CommonLib/ContextModel.cpp)
# Based on MPS (most probable symbol) and RLPS (range lost probable symbol).
# Considering M = 256 (8 bits), to define a frequency to another symbol (the opposite of RLPS - you need see MPS to check which opposite symbol) use F = 256 - RLPS.
# Some values were inverted because the frequency didn't make much sense, like an MPS = 0 but your respective RLPS = 223 (yes, the frequency of MPS was smaller of LPS)
#
# Format:
# tables:
#   name_of_table:
#     symbols:
#     - symbol_a: freq_a
#       symbol_b: freq_b
#       ...
#       symbol_n: freq_n
#
# * If you want to use this to generate a new tables to deepANS don't modify the tables names,
#   only set the frequencies (the deepANS wait the tables with that specific names)
# * To use that with deepANS export table as binary (python create_table.py --alphabet
#   <this_file> --bin <binary_table_file_name> ) and add deepANS argument --table <binary_table_file_name>

